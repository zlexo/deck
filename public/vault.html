<!doctype html><meta charset="utf-8"><title>Vault</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:dark;--bg:#0a0d12;--bg2:#0d1117;--surface:#12171f;--surface3:#1b2430;
    --line:#212b38;--line2:#2c3a4b;--text:#e8eef4;--dim:#8b98a7;--faint:#5f6b78;--accent:#34d399;--pc:#34d399}
  *{box-sizing:border-box}
  body{font:14px/1.55 -apple-system,system-ui,sans-serif;color:var(--text);margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(720px 420px at 12% -10%, #34d3990f, transparent 70%)}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:30px 30px 90px}
  h1{font-size:22px;font-weight:720;letter-spacing:-.02em;margin:0 0 3px;display:flex;align-items:center;gap:11px}
  .glyph{width:30px;height:30px}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 26px}
  .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.13em;font-weight:640;
    margin:24px 0 12px;display:flex;align-items:center;gap:10px}
  .lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .panel{background:var(--surface);border:1px solid var(--line);padding:16px 18px}
  .cap{display:flex;flex-direction:column;gap:10px}
  .cap textarea{width:100%;min-height:74px;resize:vertical;background:#0b1117;border:1px solid var(--line2);
    color:var(--text);padding:11px 13px;font:13.5px inherit;line-height:1.5}
  .cap textarea:focus{outline:0;border-color:var(--accent)}
  .cap .row{display:flex;align-items:center;gap:10px}
  .cap .hint{color:var(--faint);font-size:11.5px}
  button{border:0;padding:9px 16px;font:600 12.5px inherit;cursor:pointer;background:var(--surface3);color:var(--text);transition:.14s}
  button:hover{background:#242f3d}
  button.primary{background:var(--accent);color:#04140b}button.primary:hover{filter:brightness(1.08)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .daily{font:12px/1.7 ui-monospace,Menlo,monospace;color:#9fb0c0;white-space:pre-wrap;word-break:break-word;
    max-height:420px;overflow:auto;background:#080b0f;border:1px solid var(--line);padding:13px 15px}
  .recent .n{display:flex;align-items:center;gap:9px;padding:8px 6px;font-size:12.5px;color:var(--dim);
    border-bottom:1px solid #131a24;cursor:pointer}
  .recent .n:hover{background:#0f151d;color:var(--text)}
  .recent .n .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
  .tasks .t{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:12.5px;border-bottom:1px solid #131a24}
  .tasks .t:hover{background:#0f151d}
  .tasks .cb{width:15px;height:15px;flex:none;border:1.5px solid var(--line2);cursor:pointer;display:grid;place-items:center}
  .tasks .t.done .cb{background:var(--accent);border-color:var(--accent)}
  .tasks .t.done .x{color:var(--faint);text-decoration:line-through}
  .tasks .x{flex:1}.tasks .pj{color:var(--faint);font-size:10.5px}
  .empty{color:var(--faint);font-size:12px;padding:14px 0;text-align:center}
  /* time analytics */
  .bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding:2px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bars .b .bar{width:100%;background:linear-gradient(180deg,#34d399,#1f6f52);min-height:2px;transition:height .3s}
  .bars .b .bl{font-size:9.5px;color:var(--faint)}.bars .b .bv{font-size:9px;color:var(--dim);height:11px}
  .projtime{display:flex;flex-direction:column;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .projtime .r{display:flex;align-items:center;gap:10px;font-size:12px}
  .projtime .r .nm{color:var(--dim);width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .projtime .r .track{flex:1;height:6px;background:#0b1117}
  .projtime .r .fill{height:100%;background:var(--accent);display:block}
  .projtime .r .v{color:var(--faint);font-size:11px;width:56px;text-align:right;font-variant-numeric:tabular-nums}
  .weektot{font-size:11.5px;color:var(--faint);margin-bottom:10px}.weektot b{color:var(--text)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);opacity:0;
    background:var(--surface3);border:1px solid var(--line2);padding:10px 16px;font-size:13px;z-index:9;transition:.22s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#1e2732;border:2px solid var(--bg)}
</style>
<div id="toast"></div>
<div class="wrap">
  <h1><span class="glyph"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" fill="#06120c"/><path d="M10 11 L22 9 M10 11 L14 22 M22 9 L14 22" stroke="#1f6f52" stroke-width="1.6"/><circle cx="10" cy="11" r="3" fill="#34d399"/><circle cx="22" cy="9" r="2.5" fill="#34d399"/><circle cx="14" cy="22" r="2.6" fill="#34d399"/></svg></span> Vault</h1>
  <p class="sub">Quick-write into your second brain — capture, today, recent, tasks.</p>

  <div class="lbl">Quick capture</div>
  <div class="panel cap">
    <textarea id="cap" placeholder="Jot a thought, idea, or note… (⌘/Ctrl+Enter to save to today's daily)"></textarea>
    <div class="row"><button class="primary" onclick="capture()">Capture → today</button><span class="hint" id="caphint">Appends to Daily/<span id="today"></span>.md</span></div>
  </div>

  <div class="grid2">
    <div>
      <div class="lbl">Today's daily</div>
      <div class="daily" id="daily">…</div>
    </div>
    <div>
      <div class="lbl">Recent notes</div>
      <div class="panel recent" id="recent"></div>
      <div class="lbl">Tasks</div>
      <div class="panel tasks" id="tasks"></div>
    </div>
  </div>

  <div class="lbl">Focus time · this week</div>
  <div class="panel" id="timepanel"><div class="empty">…</div></div>
</div>
<script>
const $=(s)=>document.querySelector(s);
async function api(u,o){const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw new Error(j.error||'failed');return j}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const openPath=p=>api('/api/open',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:p})}).catch(e=>toast(e.message));

async function capture(){
  const ta=$('#cap'); const text=(ta.value||'').trim(); if(!text) return;
  try{ await api('/api/vault/capture',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})}); ta.value=''; toast('captured → today'); loadDaily(); }
  catch(e){ toast(e.message); }
}
$('#cap').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') capture(); });

async function loadDaily(){ try{ const j=await api('/api/vault/daily'); $('#today').textContent=j.date;
  $('#daily').textContent=j.exists?j.content:'(no daily note yet today — capture something to start it)'; }catch{} }
async function loadRecent(){ try{ const {notes}=await api('/api/vault/recent');
  $('#recent').innerHTML=notes.map(n=>`<div class="n" onclick="openPath('${n.path.replace(/'/g,"\\'")}')"><span class="dot"></span>${esc(n.name)}</div>`).join('')||'<div class="empty">no notes</div>'; }catch{} }
async function loadTasks(){ try{ const {tasks}=await api('/api/tasks');
  $('#tasks').innerHTML=tasks.length?tasks.map((t,i)=>`<div class="t ${t.done?'done':''}">
    <span class="cb" onclick="toggle(${i})">${t.done?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#04140b" stroke-width="3.5"><path d="M20 6L9 17l-5-5"/></svg>':''}</span>
    <span class="x">${esc(t.text)}</span>${t.project?`<span class="pj">${esc(t.project)}</span>`:''}</div>`).join(''):'<div class="empty">no tasks</div>'; }catch{} }
async function toggle(i){ try{ await api('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'toggle',index:i})}); loadTasks(); }catch(e){toast(e.message);} }

const fmtDur=sec=>{const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h?`${h}h ${m}m`:`${m}m`;};
async function loadTime(){
  try{ const d=await api('/api/vault/time-stats');
    const max=Math.max(1,...d.week.map(x=>x.seconds));
    const bars=d.week.map(x=>{ const dt=new Date(x.day+'T00:00:00'); const dl=['Su','Mo','Tu','We','Th','Fr','Sa'][dt.getDay()];
      const h=x.seconds?Math.max(3,Math.round(x.seconds/max*100)):1;
      return `<div class="b"><div class="bv">${x.seconds?fmtDur(x.seconds):''}</div><div class="bar" style="height:${h}%"></div><div class="bl">${dl}</div></div>`; }).join('');
    const projs=Object.entries(d.byProject).sort((a,b)=>b[1]-a[1]);
    const pmax=Math.max(1,...projs.map(p=>p[1]));
    const weekTot=d.week.reduce((s,x)=>s+x.seconds,0);
    const plist=projs.map(([n,s])=>`<div class="r"><span class="nm">${esc(n)}</span><span class="track"><span class="fill" style="width:${Math.round(s/pmax*100)}%"></span></span><span class="v">${fmtDur(s)}</span></div>`).join('');
    $('#timepanel').innerHTML=(weekTot||projs.length)
      ? `<div class="weektot"><b>${fmtDur(weekTot)}</b> focused this week · <b>${fmtDur(d.total)}</b> all-time</div><div class="bars">${bars}</div>${plist?`<div class="projtime">${plist}</div>`:''}`
      : '<div class="empty">No focus sessions logged yet — start the timer in the tab bar and it lands here.</div>';
  }catch{}
}
function refresh(){ loadDaily(); loadRecent(); loadTasks(); loadTime(); }
refresh(); setInterval(refresh,6000);
</script>
